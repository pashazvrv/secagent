[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tree-sitter==0.21.3",
    "tree-sitter-python>=0.23",
    "chromadb>=0.5",
    "ollama>=0.3",
    "lxml>=5",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pathspec>=0.12",
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
secagent = "secagent.cli:app"

[tool.setuptools]
packages = ["secagent"]

[tool.setuptools.package-data]
secagent = []

[tool.ruff]
line-length = 88